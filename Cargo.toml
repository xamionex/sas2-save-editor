[package]
name = "sas2-save-editor"
version = "1.4.6"
edition = "2024"

[dependencies]
sas2-parser = { git = "https://github.com/xamionex/sas2-parser.git" }
eframe = "0.36.2"
rfd = "0.17.2"
directories = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hide_console = "0.2.1"
egui = "0.36.2"
image = "0.25.10"
winit = "0.30.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
